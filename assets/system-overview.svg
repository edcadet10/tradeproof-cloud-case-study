<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">TradeProof cloud platform overview</title>
<desc id="desc">Historical Azure build with Bicep, Container Apps, PostgreSQL, Key Vault, managed identities and networking. Current Google Cloud production has Cloudflare routing to Docker applications and PostgreSQL on Compute Engine, with Artifact Registry, Secret Manager, Cloud Storage and Cloud Monitoring supporting operations.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="236" viewBox="0 0 680 236" role="img" aria-labelledby="title desc">
<title id="title">How TradeProof works</title>
<desc id="desc">Users and apps connect to TradeProof, which reads and writes a PostgreSQL database. The application and database run on Google Cloud with backups, monitoring and access control.</desc>

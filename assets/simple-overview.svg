<rect x="4" y="60" width="146" height="100" rx="10" fill="#f2f5f8" stroke="#dbe5e9"/>
<text x="77" y="99" text-anchor="middle" font-size="19" font-weight="700" fill="#142f40">Users &amp; apps</text>
<text x="77" y="127" text-anchor="middle" font-size="13" fill="#4c6575">Look up contractors</text>
